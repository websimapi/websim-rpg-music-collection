<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Scene Explorer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container">
        <header>
            <h1>RPG World Explorer</h1>
            <p class="subtitle">Click on a location to explore and hear its theme music</p>
            <button id="global-audio-toggle" class="hidden">🔊</button>
        </header>
        
        <div id="scene-container">
            <div id="scene-info">
                <h2 id="scene-title">Select a location</h2>
                <p id="scene-description">Click on a location on the map to explore</p>
                <div class="scene-controls">
                    <button id="panoramic-btn" class="panoramic-button" style="display: none;" title="View in Panoramic">🌐</button>
                </div>
            </div>
            <div id="world-map">
                <!-- Map will be displayed here -->
            </div>
            <div id="scene-viewer">
                <div id="scene-image"></div>
                <div class="audio-controls">
                    <audio id="scene-audio" loop></audio>
                </div>
            </div>
        </div>
        
        <div id="location-selector">
            <h3>Available Locations</h3>
            <div id="location-grid">
                <!-- Location cards will be loaded here by JavaScript -->
            </div>
        </div>
    </div>
    <div id="panoramic-viewer" class="panoramic-viewer hidden">
        <div id="panoramic-container"></div>
        <button id="close-panoramic" class="close-panoramic">✕ Close Panoramic View</button>
        <div id="panoramic-loading">Loading panoramic view...</div>
    </div>
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
      }
    }
    </script>
    <script type="module" src="script.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
